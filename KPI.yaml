version: "1.0"
name: idol-playlist-kpi
description: "地下アイドル楽曲の『聞かれる曲』KPI。2026-09-18時点の15曲を生成。"
observed_at: "2026-09-18"
population:
  scope: "2026 sample underground-idol song catalog"
  count: 15
  note: "sample_metrics=true のサンプルデータ。実測ランキングではない。"

definition:
  purpose: "楽曲への関心・質問・探索行動を継続観測する"
  score: "catalog.score"
  ranking_direction: "desc"
  quality: "scoreは楽曲の良さではなく、聞かれる・探される関心度を表すプロジェクト指標"

kpis:
  - id: score
    label: "聞かれる曲スコア"
    field: score
    direction: max
  - id: ask_count
    label: "質問・問い合わせ数"
    field: ask_count
    direction: max
  - id: unique_askers
    label: "質問者ユニーク数"
    field: unique_askers
    direction: max
  - id: repeat_ask_count
    label: "再質問数"
    field: repeat_ask_count
    direction: max
  - id: recent_ask_count
    label: "直近質問数"
    field: recent_ask_count
    direction: max
  - id: lyrics_view
    label: "歌詞ページ閲覧"
    field: lyrics_view
    direction: max
  - id: youtube_view
    label: "YouTube再生数"
    field: youtube_view
    direction: max

