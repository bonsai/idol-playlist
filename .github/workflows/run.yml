name: idol-playlist
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python manage.py migrate --noinput
      - run: aw run
      - name: Commit weekly and monthly KPI history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rankings data/weekly data/monthly data/youtube/playlist.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "data: update weekly top 10 and monthly KPI"
            git push
          fi
