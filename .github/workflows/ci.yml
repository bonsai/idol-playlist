name: idol-playlist-ci

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e .

      - name: Check Django migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate Django
        run: python manage.py migrate --noinput

      - name: Run playlist workflow
        run: aw run
