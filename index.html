<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>聞かれる曲｜地下アイドル PLAYLIST</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#121212;color:#b3b3b3;font:14px Arial,sans-serif}
.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr;grid-template-rows:1fr 82px}
.sidebar{background:#000;padding:24px 16px;grid-row:1/2}
.logo{font-size:20px;color:#fff;font-weight:bold;margin-bottom:28px}.nav div{padding:10px 8px;color:#aaa}.nav .active{color:#fff;background:#282828;border-radius:3px}
.playlists{margin-top:28px;border-top:1px solid #282828;padding-top:18px;font-size:12px}.playlists b{display:block;color:#fff;margin-bottom:12px}
.main{background:linear-gradient(#282828,#181818 260px);overflow:auto;padding-bottom:100px}
.top{padding:28px 34px 18px}.crumb{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.12em}.title{font-size:34px;color:#fff;font-weight:bold;margin:12px 0 4px}.sub{font-size:13px}
.tabs{display:flex;gap:4px;margin-top:22px}.tab{background:transparent;border:0;color:#aaa;padding:8px 16px;font-weight:bold;cursor:pointer}.tab.active{color:#fff;border-bottom:2px solid #fff}
.list{padding:8px 28px}.head,.track{display:grid;grid-template-columns:42px 1fr 100px 70px 90px;align-items:center;gap:10px}.head{border-bottom:1px solid #444;padding:8px 10px;color:#888;font-size:11px;text-transform:uppercase}.track{padding:9px 10px;border-radius:3px;cursor:pointer}.track:hover{background:#2a2a2a;color:#fff}.num{font-variant-numeric:tabular-nums;text-align:center}.name{color:#fff;font-weight:bold}.artist{font-size:12px;color:#999;margin-top:3px}.plays{text-align:right;font-variant-numeric:tabular-nums}.score{text-align:right;color:#fff;font-weight:bold}.links{display:flex;gap:5px;justify-content:flex-end}.links a{color:#ddd;text-decoration:none;border:1px solid #555;border-radius:3px;padding:3px 6px;font-size:11px}
.player{grid-column:1/3;background:#181818;border-top:1px solid #282828;display:grid;grid-template-columns:220px 1fr 260px;align-items:center;padding:10px 18px;position:sticky;bottom:0}.now{min-width:0}.now b{color:#fff}.now small{display:block;margin-top:4px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{text-align:center;color:#fff;font-size:24px}.controls button{background:none;border:0;color:#fff;cursor:pointer;font-size:22px;margin:0 9px}.bar{height:3px;background:#555;margin:5px auto;max-width:360px}.bar span{display:block;width:35%;height:100%;background:#fff}
.volume{text-align:right;color:#aaa}
@media(max-width:700px){body{font-size:13px}.app{grid-template-columns:1fr;grid-template-rows:auto 82px}.sidebar{display:none}.main{grid-column:1}.player{grid-column:1;grid-template-columns:1fr 1fr}.volume{display:none}.top{padding:22px 18px}.list{padding:8px 12px}.head,.track{grid-template-columns:32px 1fr 58px}.plays{display:none}.title{font-size:27px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="logo">◉ MUSIC</div>
<div class="nav"><div>⌂ ホーム</div><div class="active">♫ プレイリスト</div><div>🔍 検索</div></div>
<div class="playlists"><b>PLAYLIST</b><div>地下アイドル</div><div>聞かれる曲 BEST</div><div>2026 BEST 100</div></div>
</aside>
<main class="main">
<header class="top">
<div class="crumb">Playlist / Underground Idol</div>
<div class="title">聞かれる曲 BEST</div>
<div class="sub">地下アイドル｜W 今週・M 今月・Y 今年</div>
<div class="tabs">
<button class="tab active" data-period="week">W 今週</button>
<button class="tab" data-period="month">M 今月</button>
<button class="tab" data-period="year">Y 今年</button>
</div>
</header>
<section class="list">
<div class="head"><div>#</div><div>曲</div><div>再生</div><div>Score</div><div>LINK</div></div>
<div id="tracks"></div>
</section>
</main>
<footer class="player">
<div class="now"><b id="nowTitle">聞かれる曲 BEST</b><small id="nowArtist">曲をクリックして再生</small></div>
<div class="controls"><button id="prev">‹</button><button id="play">▶</button><button id="next">›</button><div class="bar"><span id="progress"></span></div></div>
<div class="volume">🔊 ━━━━━</div>
</footer>
</div>
<script>
const songs=[
["うますぎる","pinponpanpon","LIZqyeTIE6Y",97,22100],["心中未遂","MADOROMI-マドロミ-","vFlfDfH4O40",95,20400],["プロット。","キングサリ","aOuQpvmLhGc",94,17800],["トベトベトべ","兎アイズ","6EzBz332Fg0",93,18700],["Kill my ENDROLL","9DayzGlitchClubTokyo","L8vvJcWxq64",91,15600],["曖昧妄想STORY-2026 ver-","metarium","4CyzYdwoHO4",90,14900],["スーパーモデルでGo!!","Tnaka","g-ayoPyL6sY",88,12400],["A・RA・WA","道玄坂69","yAIrcsxAIJw",86,10100],["Cry (2026 Remastered)","LEIWAN","GnCzzCCXpF0",84,11300],["ギミックアイ","兎アイズ","U4pK3q7XHZE",83,12400]];
const factor={week:1,month:.94,year:.88};
function render(period){
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.period===period));
 document.getElementById("tracks").innerHTML=songs.slice(0,30).map((s,i)=>'<div class="track"><div class="num">'+String(i+1).padStart(2,"0")+'</div><div><div class="name">'+s[0]+'</div><div class="artist">'+s[1]+'</div></div><div class="plays">'+Math.round(s[4]*factor[period]).toLocaleString()+'</div><div class="score">'+Math.round(s[3]*factor[period])+'</div><div class="links">'+(s[2]?'<a href="https://www.youtube.com/watch?v='+s[2]+'" target="_blank">YT</a>':'')+'<a href="https://open.spotify.com/search/'+encodeURIComponent(s[1]+" "+s[0])+'" target="_blank">SP</a></div></div>').join("");
 
}
function select(t){
 document.getElementById("nowTitle").textContent=t.dataset.title;
 document.getElementById("nowArtist").textContent=t.dataset.artist;
 document.getElementById("play").textContent="❚❚";
 document.getElementById("progress").style.width="65%";
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>render(b.dataset.period));
document.getElementById("play").onclick=()=>document.getElementById("play").textContent=document.getElementById("play").textContent==="▶"?"❚❚":"▶";
render("week");
</script>
</body>
</html>
