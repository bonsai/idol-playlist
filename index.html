<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地下アイドル｜聞かれる曲 TV</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:system-ui,sans-serif;min-height:100vh}
.tv{max-width:980px;margin:auto;padding:28px 18px 60px}
.screen{background:#000;border:2px solid #333;border-radius:10px;padding:22px;box-shadow:0 0 35px #000}
.brand{font-size:12px;letter-spacing:.22em;color:#aaa;margin-bottom:10px}
h1{font-size:clamp(24px,5vw,48px);margin:0 0 6px}.meta{color:#aaa;font-size:13px}
.tabs{display:flex;gap:8px;margin:18px 0}.tab{background:#222;color:#fff;border:1px solid #555;padding:9px 18px;border-radius:4px;font-weight:800;cursor:pointer}.tab.active{background:#fff;color:#000}
.rankboard{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:90px 1fr 90px;align-items:center;min-height:64px;background:#050505;border:1px solid #252525;padding:8px 12px;cursor:pointer;transition:.15s}
.row:hover{background:#181818;border-color:#777}
.rank{font-family:monospace;font-size:30px;font-weight:900;letter-spacing:.04em}
.flip{display:inline-block;min-width:2.2em;background:#171717;border:1px solid #444;padding:2px 5px;text-align:center;font-variant-numeric:tabular-nums}
.info{min-width:0}.title{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{color:#aaa;font-size:13px}.score{text-align:right;font-family:monospace;font-size:26px;font-weight:900}
.hint{color:#777;font-size:12px;margin-top:10px}
.video{display:none;margin-top:14px;background:#000;border:1px solid #444;padding:10px}.video.open{display:block}.video iframe{width:100%;aspect-ratio:16/9;border:0}.close{margin:0 0 8px;color:#aaa;font-size:12px;cursor:pointer}
@media(max-width:600px){.row{grid-template-columns:65px 1fr 62px}.rank{font-size:22px}.title{font-size:16px}.score{font-size:20px}}
</style>
</head>
<body>
<div class="tv">
<section class="screen">
<div class="brand">UNDERGROUND IDOL MUSIC TV</div>
<h1>🎤 聞かれる曲 BEST</h1>
<div class="meta">2026-09-18｜W / M / Y</div>
<div class="tabs">
<button class="tab active" data-period="week">W 今週</button>
<button class="tab" data-period="month">M 今月</button>
<button class="tab" data-period="year">Y 今年</button>
</div>
<div id="board" class="rankboard"></div>
<div class="hint">▼ ランキングは10位からパタパタ登場　曲をクリックすると映像</div>
<div id="video" class="video"><div class="close" onclick="closeVideo()">× CLOSE</div><iframe id="player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
</section>
</div>
<script>
const songs=[
["うますぎる","pinponpanpon","LIZqyeTIE6Y",97],["心中未遂","MADOROMI-マドロミ-","vFlfDfH4O40",95],["プロット。","キングサリ","aOuQpvmLhGc",94],["トベトベトべ","兎アイズ","6EzBz332Fg0",93],["Kill my ENDROLL","9DayzGlitchClubTokyo","L8vvJcWxq64",91],["曖昧妄想STORY-2026 ver-","metarium","4CyzYdwoHO4",90],["スーパーモデルでGo!!","Tnaka","g-ayoPyL6sY",88],["A・RA・WA","道玄坂69","yAIrcsxAIJw",86],["Cry (2026 Remastered)","LEIWAN","GnCzzCCXpF0",84],["ギミックアイ","兎アイズ","U4pK3q7XHZE",83]];
const factor={week:1,month:.94,year:.88};
let period="week";
function flip(el,value){
 el.textContent="--";
 setTimeout(()=>el.textContent=value,180);
}
function render(p){
 period=p;
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.period===p));
 const items=songs.slice().reverse();
 document.getElementById("board").innerHTML=items.map((s,i)=>{
   const rank=songs.length-i;
   const score=Math.round(s[3]*factor[p]);
   return '<div class="row" data-video="'+s[2]+'" data-title="'+s[0]+'"><div class="rank"><span class="flip">--</span></div><div class="info"><div class="title">'+s[0]+'</div><div class="artist">'+s[1]+'</div></div><div class="score">'+score+'</div></div>';
 }).join("");
 [...document.querySelectorAll(".row")].forEach((row,i)=>{
   setTimeout(()=>flip(row.querySelector(".flip"),String(songs.length-i).padStart(2,"0")),i*220);
   row.addEventListener("click",()=>openVideo(row.dataset.video));
 });
}
function openVideo(id){
 document.getElementById("player").src="https://www.youtube.com/embed/"+id+"?autoplay=1";
 document.getElementById("video").classList.add("open");
 document.getElementById("video").scrollIntoView({behavior:"smooth",block:"center"});
}
function closeVideo(){
 document.getElementById("player").src="";
 document.getElementById("video").classList.remove("open");
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>render(b.dataset.period)));
render("week");
</script>
</body>
</html>
