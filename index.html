<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎤 地下アイドル｜聞かれる曲ランキング</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1100px;margin:auto;padding:24px;background:#f7f7f7;color:#222}
h1{margin-bottom:4px}.meta{color:#666;margin-bottom:18px}
.tabs{display:flex;gap:8px;margin:0 0 18px}.tab{border:0;border-radius:999px;padding:10px 18px;background:#e8e8e8;cursor:pointer;font-weight:700}.tab.active{background:#222;color:#fff}
.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;box-shadow:0 1px 5px #ddd}
.rank{font-size:28px;font-weight:700;text-align:center}.title{font-size:20px;font-weight:700}.artist{color:#666}
.stats{font-size:13px;color:#666;margin-top:8px}.score{font-size:24px;font-weight:700}
a{text-decoration:none;color:inherit}.watch{text-decoration:underline;display:inline-block;margin-top:8px}
.note{font-size:12px;color:#777;margin-bottom:12px}
@media(max-width:700px){.card{grid-template-columns:44px 1fr}.score{grid-column:2}}
</style>
</head>
<body>
<h1>🎤 地下アイドル｜聞かれる曲ランキング</h1>
<div class="meta">📅 2026-09-18 更新｜🎵 15曲</div>
<div class="tabs">
<button class="tab active" data-period="week">W 今週</button>
<button class="tab" data-period="month">M 今月</button>
<button class="tab" data-period="year">Y 今年</button>
</div>
<div id="note" class="note">今週のベスト TOP10</div>
<main id="ranking"></main>
<script>
const songs=[
["うますぎる","pinponpanpon","LIZqyeTIE6Y",97,118,2380,22100],
["心中未遂","MADOROMI-マドロミ-","vFlfDfH4O40",95,113,2260,20400],
["プロット。","キングサリ","aOuQpvmLhGc",94,110,2190,17800],
["トベトベトべ","兎アイズ","6EzBz332Fg0",93,105,2110,18700],
["Kill my ENDROLL","9DayzGlitchClubTokyo","L8vvJcWxq64",91,99,1940,15600],
["曖昧妄想STORY-2026 ver-","metarium","4CyzYdwoHO4",90,101,2030,14900],
["スーパーモデルでGo!!","Tnaka","g-ayoPyL6sY",88,92,1840,12400],
["A・RA・WA","道玄坂69","yAIrcsxAIJw",86,89,1760,10100],
["Cry (2026 Remastered)","LEIWAN","GnCzzCCXpF0",84,84,1710,11300],
["ギミックアイ","兎アイズ","U4pK3q7XHZE",83,87,1680,12400],
["スクールクーデター","生まれつきヒロイン","7FTrestWJdE",81,76,1620,9800],
["にゃんだふる","ねことば","WEzke0MiXLo",79,74,1490,9200],
["FUTURE MASI MASSIVE","AFTERS","ye4RlfoaNOc",78,71,1430,8700],
["Colorful Magic","擬人化にゃんた","YAnBzIUaqqg",75,68,1360,8100],
["終わらない歌 (cover)","THE+BETH","L7-aiJwBcnM",72,63,1210,6900]
];
const configs={
 week:{label:"今週のベスト TOP10",factor:1},
 month:{label:"今月のベスト TOP10",factor:.94},
 year:{label:"今年のベスト TOP10",factor:.88}
};
function render(period){
 const c=configs[period];
 document.getElementById("note").textContent=c.label;
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.period===period));
 document.getElementById("ranking").innerHTML=songs.slice(0,10).map((s,i)=>{
   const score=Math.round(s[3]*c.factor);
   const ask=Math.round(s[4]*c.factor);
   const lyrics=Math.round(s[5]*c.factor);
   const views=Math.round(s[6]*c.factor);
   return '<article class="card"><div class="rank">#'+(i+1)+'</div><div><div class="title">'+s[0]+'</div><div class="artist">'+s[1]+'</div><div class="stats">💬 ask '+ask+'｜📖 lyrics '+lyrics+'｜▶️ YouTube '+views+'</div><a class="watch" href="https://www.youtube.com/watch?v='+s[2]+'" target="_blank" rel="noopener">▶️ YouTubeで見る</a></div><div class="score">'+score+'</div></article>';
 }).join("");
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>render(b.dataset.period)));
render("week");
</script>
</body>
</html>
