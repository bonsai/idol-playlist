<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地下アイドル｜聞かれる曲ランキング</title><style>body{font-family:system-ui,sans-serif;max-width:1100px;margin:auto;padding:24px;background:#f7f7f7;color:#222}h1{margin-bottom:4px}.meta{color:#666;margin-bottom:24px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;box-shadow:0 1px 5px #ddd}.rank{font-size:28px;font-weight:700;text-align:center}.title{font-size:20px;font-weight:700}.artist{color:#666}.stats{font-size:13px;color:#666;margin-top:8px}.score{font-size:24px;font-weight:700}a{text-decoration:none;color:inherit}.watch{text-decoration:underline;display:inline-block;margin-top:8px}@media(max-width:700px){.card{grid-template-columns:44px 1fr}.score{grid-column:2}}</style></head><body><h1>地下アイドル｜聞かれる曲ランキング</h1><div class="meta" id="meta">読み込み中…</div><main id="list"></main><script>const e=s=>String(s??"").replace(/[&<>"\x27]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","\x27":"&#39;"}[c]));async function load(){const r=await fetch("data/youtube/playlist.json");if(!r.ok)throw Error("playlist.json が見つかりません");const d=await r.json();document.getElementById("meta").textContent=d.generated_at+" 更新｜"+d.items.length+"曲";document.getElementById("list").innerHTML=d.items.map(x=>{const u=x.youtube_video_id?"https://www.youtube.com/watch?v="+encodeURIComponent(x.youtube_video_id):"";return "<article class=\"card\"><div class=\"rank\">#"+x.rank+"</div><div><div class=\"title\">"+e(x.title)+"</div><div class=\"artist\">"+e(x.artist)+"</div><div class=\"stats\">ask "+(x.ask_count??0)+"｜lyrics "+(x.lyrics_view??0)+"｜YouTube "+(x.youtube_view??0)+"</div>"+(u?"<a class=\"watch\" href=\""+u+"\" target=\"_blank\" rel=\"noopener\">▶ YouTubeで見る</a>":"")+"</div><div class=\"score\">"+(x.score??0)+"</div></article>"}).join("")}load().catch(x=>document.getElementById("meta").textContent=x.message);</script></body></html>
