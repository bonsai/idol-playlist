<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111">
<title>アイドルプレイリスト</title>
<script>window.GA4_MEASUREMENT_ID="G-XXXXXXXXXX";</script>
<script src="./analytics.js" defer></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#121212;color:#fff;font-family:Arial,sans-serif}
main{width:min(100%,720px);margin:auto;padding:24px 16px 48px}
h1{margin:0;font-size:28px}
.lead{margin:6px 0 22px;color:#999;font-size:14px}
.player{background:#000;border-radius:10px;overflow:hidden;margin-bottom:20px}
.player iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
.placeholder{aspect-ratio:16/9;display:grid;place-items:center;color:#777;font-size:14px}
.now{padding:12px 14px}
.now strong{display:block;font-size:17px}
.now span{display:block;margin-top:4px;color:#999;font-size:14px}
.controls{display:flex;gap:8px;margin-bottom:22px}
button{border:0;border-radius:8px;padding:11px 16px;background:#292929;color:#fff;font-size:15px}
button.primary{background:#fff;color:#111}
.list{display:grid;gap:4px}
.track{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:13px 8px;border-radius:8px}
.track:active,.track:hover{background:#222}
.num{color:#777;font-size:13px;text-align:center}
.name{font-size:16px;font-weight:bold}
.artist{color:#999;font-size:13px;margin-top:3px}
.links{display:flex;gap:6px}
.links a{color:#aaa;text-decoration:none;border:1px solid #444;border-radius:6px;padding:6px 8px;font-size:12px}
@media(max-width:480px){
main{padding:18px 12px 36px}
h1{font-size:24px}
.track{grid-template-columns:28px 1fr}
.links{grid-column:2}
.links a{padding:5px 9px}
.controls button{flex:1}
}
</style>
</head>
<body>
<main>
<h1>アイドルプレイリスト</h1>
<p class="lead">オシャレコMUSIC</p>
<section class="player" id="player">
<div class="placeholder">曲を選んで再生</div>
<div class="now"><strong id="nowTitle">アイドルプレイリスト</strong><span id="nowArtist">曲を選択してください</span></div>
</section>
<div class="controls">
<button class="primary" id="play">▶ 再生</button>
<button id="prev">‹ 前へ</button>
<button id="next">次へ ›</button>
</div>
<section class="list" id="tracks"></section>
</main>
<script>
const songs=[
["うますぎる","pinponpanpon","LIZqyeTIE6Y"],
["心中未遂","MADOROMI-マドロミ-","vFlfDfH4O40"],
["プロット。","キングサリ","aOuQpvmLhGc"],
["トベトベトべ","兎アイズ","6EzBz332Fg0"],
["Kill my ENDROLL","9DayzGlitchClubTokyo","L8vvJcWxq64"],
["曖昧妄想STORY-2026 ver-","metarium","4CyzYdwoHO4"],
["スーパーモデルでGo!!","Tnaka","g-ayoPyL6sY"],
["A・RA・WA","道玄坂69","yAIrcsxAIJw"],
["Cry (2026 Remastered)","LEIWAN","GnCzzCCXpF0"],
["ギミックアイ","兎アイズ","U4pK3q7XHZE"]
];
let current=0;
const tracks=document.getElementById("tracks");
function render(){
tracks.innerHTML=songs.map((s,i)=>`<article class="track" data-i="${i}">
<div class="num">${String(i+1).padStart(2,"0")}</div>
<div><div class="name">${s[0]}</div><div class="artist">${s[1]}</div></div>
<div class="links"><a href="https://www.youtube.com/watch?v=${s[2]}" target="_blank" rel="noopener">YouTube</a></div>
</article>`).join("");
}
function select(i){
current=(i+songs.length)%songs.length;
const s=songs[current];
window.track?.("select_song",{song_name:s[0],artist_name:s[1],position:current+1});
document.getElementById("player").innerHTML=`<iframe src="https://www.youtube.com/embed/${s[2]}?autoplay=1" title="${s[0]}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe><div class="now"><strong>${s[0]}</strong><span>${s[1]}</span></div>`;
}
tracks.addEventListener("click",e=>{const link=e.target.closest("a"); if(link){const t=e.target.closest(".track"); if(t) window.track?.("youtube_click",{song_name:songs[+t.dataset.i][0],artist_name:songs[+t.dataset.i][1]}); return;} const t=e.target.closest(".track");if(t)select(+t.dataset.i)});
document.getElementById("play").onclick=()=>{window.track?.("play_song",{song_name:songs[current][0],artist_name:songs[current][1]});select(current)};
document.getElementById("prev").onclick=()=>select(current-1);
document.getElementById("next").onclick=()=>select(current+1);
render();
</script>
</body>
</html>
