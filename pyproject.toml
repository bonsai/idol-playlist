[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "idol-playlist"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["django>=5.2,<6", "langgraph>=0.6,<1", "langchain-core>=0.3,<2"]

[tool.setuptools.packages.find]
include = ["app*", "catalog*"]

[project.scripts]
aw = "app.cli:main"
